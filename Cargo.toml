[workspace]
# wgpu requires the newer resolver
resolver = "2"
members = ["wgsl_bindgen", "example"]

[workspace.package]
version = "0.22.3"
authors = ["swoorup", "ScanMountGoat(Original Fork)"]
edition = "2021"
repository = "https://github.com/Swoorup/wgsl_bindgen"
license = "MIT"
documentation = "https://docs.rs/wgsl_bindgen"

[workspace.dependencies]
blake3 = "1.8"
bytemuck = "1.25"
case = "1.0"
colored = "3.1"
data-encoding = "2.11"
educe = "0.7"
derive_builder = "0.20"
derive_more = { version = "2.0", features = ["full"] }
encase = "0.12"
enumflags2 = "0.7"
futures = "0.3"
fxhash = "0.2"
glam = "0.33"
heck = "0.5"
include_absolute_path = "0.1"
indexmap = "2.7"
indoc = "2.0"
miette = "7.5"
naga = { version = "30", features = ["wgsl-in", "wgsl-out"] }
naga_oil = "0.23"
pathdiff = "0.2"
pretty_assertions = "1.4"
prettyplease = "0.3"
proc-macro2 = "1.0"
quote = "1.0"
regex = "1.13"
regex-syntax = "0.8"
smallvec = "1.14"
smol_str = "0.3"
strum = "0.28"
strum_macros = "0.28"
syn = "3.0"
thiserror = "2.0"
wgpu = "30"
wgpu-types = "30"
winit = "0.30"
insta = "1.48"
stdext = "0.3.1"
toml = "1.1"
